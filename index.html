
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows Update</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }

  .screen {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  .content {
    text-align: center;
    transform: translateY(-12px);
  }

  .spinner {
    width: 43px;
    height: 43px;
    margin: 0 auto 37px;
    animation: rotate 3.2s linear infinite;
  }

  .spinner circle {
    fill: none;
    stroke: white;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 12 114;
    transform-origin: center;
    animation: crawl 2.5s ease-in-out infinite;
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  @keyframes crawl {
    0% { stroke-dasharray: 4 122; stroke-dashoffset: 0; }
    45% { stroke-dasharray: 70 56; stroke-dashoffset: -22; }
    100% { stroke-dasharray: 4 122; stroke-dashoffset: -126; }
  }

  .heading {
    font-size: 29px;
    font-weight: 400;
    line-height: 1.45;
  }

  .percent {
    font-size: 29px;
    font-weight: 400;
    margin-top: 2px;
  }

  .subtext {
    font-size: 21px;
    font-weight: 400;
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="screen">
  <div class="content">
    <svg class="spinner" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="20"/>
    </svg>

    <div class="heading">Updates are underway.</div>
    <div class="percent"><span id="progress">0</span>% complete</div>
    <div class="subtext">Please keep your computer on.</div>
  </div>
</div>

<script>
  let progress = 0;
  let speed = 1;
  let finished = false;
  let timer;

  const progressText = document.getElementById("progress");

  function update() {
    if (finished) return;

    // Random pauses to simulate freezing
    const pauseChance = Math.random();

    if (pauseChance < 0.24) {
      schedule(1500 + Math.random() * 6500);
      return;
    }

    // Random percentage jumps
    let jump;

    const roll = Math.random();

    if (roll < 0.30) {
      jump = 1;
    } else if (roll < 0.60) {
      jump = 2 + Math.floor(Math.random() * 3);
    } else if (roll < 0.90) {
      jump = 5 + Math.floor(Math.random() * 5);
    } else {
      jump = 10 + Math.floor(Math.random() * 5);
    }

    progress = Math.min(100, progress + jump);
    progressText.textContent = progress;

    if (progress >= 100) {
      finished = true;

      setTimeout(() => {
        progress = 0;
        progressText.textContent = 0;
        finished = false;
        schedule(1000);
      }, 6000);

      return;
    }

    schedule(900 + Math.random() * 2600);
  }

  function schedule(delay) {
    clearTimeout(timer);
    timer = setTimeout(update, delay / speed);
  }

  document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if (key === "q") {
      speed = Math.max(0.1, speed / 1.6);
    }

    if (key === "e") {
      speed = Math.min(20, speed * 1.6);
    }

    if (key === "f") {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  });

  schedule(1800);
</script>

</body>
</html>
