<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updates are underway</title><style>
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;background:#000;color:#fff;font-family:'Segoe UI Variable','Segoe UI',Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;overflow:hidden}.center{display:flex;flex-direction:column;align-items:center;transform:translateY(-3px);text-align:center}.spinner{height:48px;width:48px;animation:spin 1s linear infinite;margin-bottom:19px}@keyframes spin{to{transform:rotate(360deg)}}.main,.sub{font-size:19px;font-weight:500;line-height:27px}.fullscreen{position:fixed;bottom:15px;right:15px;opacity:0;border:0;background:transparent;color:#fff;font-size:12px;cursor:pointer;padding:10px}.fullscreen:focus-visible,.fullscreen:hover{opacity:.7}</style></head><body><div class="center"><svg class="spinner" viewBox="0 0 48 48" aria-hidden="true"><path d="M 24 5 A 19 19 0 0 1 43 24" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/></svg><div class="main">Updates are underway. <span id="pct">0</span>%</div><div class="sub">Please keep your computer on.</div></div><button class="fullscreen" id="full" aria-label="Toggle fullscreen">Fullscreen</button><script>document.getElementById('full').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}});
const pct = document.getElementById('pct');
let progress = 0;
let speed = 1;
let timeout;
function tick() {
  if (progress >= 100) return;
  // Some pauses are noticeably long, like a real update.
  const roll = Math.random();
  if (roll < 0.28) {
    timeout = setTimeout(tick, (3500 + Math.random()*9500)/speed);
    return;
  }
  const jumpRoll = Math.random();
  const jump = jumpRoll < .42 ? 1 : jumpRoll < .78 ? 2 + Math.floor(Math.random()*3) : 5 + Math.floor(Math.random()*3);
  progress = Math.min(100, progress + jump);
  pct.textContent = progress;
  if (progress < 100) timeout = setTimeout(tick, (1300 + Math.random()*3600)/speed);
}
document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (key === 'q') speed = Math.max(0.15, speed/1.5);
  if (key === 'e') speed = Math.min(8, speed*1.5);
  if (key === 'f') document.getElementById('full').click();
});
timeout = setTimeout(tick, 2200);
</script></body></html>
