<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updates are underway</title><style>
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;background:#000;color:#fff;font-family:'Segoe UI Variable','Segoe UI',Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;overflow:hidden}.center{display:flex;flex-direction:column;align-items:center;transform:translateY(-3px);text-align:center}.spinner{height:48px;width:48px;animation:spin 1s linear infinite;margin-bottom:19px}@keyframes spin{to{transform:rotate(360deg)}}.main,.sub{font-size:19px;font-weight:500;line-height:27px}.fullscreen{position:fixed;bottom:15px;right:15px;opacity:0;border:0;background:transparent;color:#fff;font-size:12px;cursor:pointer;padding:10px}.fullscreen:focus-visible,.fullscreen:hover{opacity:.7}</style></head><body><div class="center"><svg class="spinner" viewBox="0 0 48 48" aria-hidden="true"><path d="M 24 5 A 19 19 0 0 1 43 24" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/></svg><div class="main">Updates are underway. 67%</div><div class="sub">Please keep your computer on.</div></div><button class="fullscreen" id="full" aria-label="Toggle fullscreen">Fullscreen</button><script>document.getElementById('full').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}});</script></body></html>
