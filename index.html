<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updates are underway</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:'Segoe UI Variable','Segoe UI',Arial,sans-serif}body{display:grid;place-items:center;overflow:hidden}.content{display:flex;align-items:center;flex-direction:column;transform:translateY(-3vh);text-align:center}.spinner{width:42px;height:42px;margin-bottom:21px;overflow:visible}.spinner circle{fill:none;stroke:white;stroke-width:5.2;stroke-linecap:round;transform-origin:50% 50%;stroke-dasharray:9 116;animation:stretch 2.8s cubic-bezier(.45,0,.55,1) infinite,turn 2.3s linear infinite}.headline,.sub{font-size:clamp(18px,2.05vw,24px);font-weight:500;line-height:1.38}.sub{margin-top:2px}@keyframes turn{to{transform:rotate(360deg)}}@keyframes stretch{0%{stroke-dasharray:3 122;stroke-dashoffset:0}40%{stroke-dasharray:70 55;stroke-dashoffset:-16}70%{stroke-dasharray:12 113;stroke-dashoffset:-92}100%{stroke-dasharray:3 122;stroke-dashoffset:-125}}</style></head><body><main class="content"><svg class="spinner" viewBox="0 0 50 50" aria-label="Loading"><circle cx="25" cy="25" r="20"/></svg><div class="headline">Updates are underway. <span id="percent">0</span>%</div><div class="sub">Please keep your computer on.</div></main><script>let percent=0,speed=1,pausedUntil=0;const el=document.getElementById('percent');function tick(){const now=Date.now();if(now>=pausedUntil&&percent<100){percent+=Math.random()<.18?Math.floor(Math.random()*5)+3:Math.random()<.48?2:1;percent=Math.min(100,percent);el.textContent=percent;pausedUntil=now+(Math.random()<.29?Math.random()*2200+600:0)}if(percent<100)setTimeout(tick,(Math.random()*1100+450)/speed);else{percent=0;el.textContent=0;setTimeout(tick,2400)}}setTimeout(tick,900);document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='q')speed=Math.max(.15,speed/1.7);if(e.key.toLowerCase()==='e')speed=Math.min(8,speed*1.7);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});</script></body></html>
